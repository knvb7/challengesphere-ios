<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1024, initial-scale=1">
  <title>ChallengeSphere Feature Graphic Social</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 1024px;
      height: 500px;
      margin: 0;
      overflow: hidden;
      background: #040306;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #ffffff;
    }

    .frame {
      position: relative;
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 16%, rgba(71, 0, 236, 0.42), transparent 30%),
        radial-gradient(circle at 82% 76%, rgba(71, 0, 236, 0.38), transparent 32%),
        linear-gradient(145deg, #030204 0%, #120824 52%, #040306 100%);
    }

    .beam {
      position: absolute;
      left: -70px;
      top: 88px;
      width: 1140px;
      height: 260px;
      transform: rotate(-8deg);
      background: linear-gradient(90deg, transparent 0%, rgba(143, 107, 255, 0.18) 22%, rgba(34, 211, 238, 0.1) 48%, rgba(143, 107, 255, 0.2) 72%, transparent 100%);
      filter: blur(1px);
    }

    .content {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 42px;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 56px 70px;
    }

    .logo-stage {
      position: relative;
      display: grid;
      place-items: center;
      width: 318px;
      height: 318px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.14), rgba(255,255,255,0.03) 62%, transparent 63%);
      box-shadow: 0 34px 94px rgba(71, 0, 236, 0.46);
    }

    .logo-stage::before,
    .logo-stage::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(196, 181, 253, 0.26);
    }

    .logo-stage::before {
      inset: -26px;
    }

    .logo-stage::after {
      inset: 34px;
      border-color: rgba(34, 211, 238, 0.18);
    }

    .logo {
      position: relative;
      z-index: 1;
      width: 252px;
      height: 252px;
      object-fit: contain;
      border-radius: 50%;
    }

    .copy {
      max-width: 566px;
    }

    .eyebrow {
      color: #c4b5fd;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
    }

    h1 {
      margin: 16px 0 18px;
      font-size: 63px;
      line-height: 1;
      letter-spacing: 0;
      font-weight: 700;
    }

    .accent {
      color: #b78cff;
    }

    p {
      margin: 0;
      color: rgba(255, 255, 255, 0.76);
      font-size: 25px;
      line-height: 1.24;
      font-weight: 600;
      letter-spacing: 0;
    }

    .footer {
      display: inline-flex;
      margin-top: 30px;
      padding: 13px 18px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: rgba(255, 255, 255, 0.86);
      font-size: 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="beam"></div>
    <section class="content">
      <div class="logo-stage">
        <img class="logo" src="../assets/images/logo.png" alt="">
      </div>
      <div class="copy">
        <div class="eyebrow">ChallengeSphere</div>
        <h1>Habit tracking is lonely. <span class="accent">Make it social.</span></h1>
        <p>Join progress-based challenges, share submissions, and stay accountable with people chasing goals like yours.</p>
        <div class="footer">Daily submissions • Community • Leaderboards</div>
      </div>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1024, initial-scale=1">
  <title>ChallengeSphere Feature Graphic</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 1024px;
      height: 500px;
      margin: 0;
      overflow: hidden;
      background: #050407;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #ffffff;
    }

    .frame {
      position: relative;
      width: 1024px;
      height: 500px;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 22%, rgba(143, 107, 255, 0.46), transparent 28%),
        radial-gradient(circle at 16% 86%, rgba(34, 211, 238, 0.22), transparent 28%),
        linear-gradient(135deg, #040306 0%, #10071d 45%, #050407 100%);
    }

    .orbit {
      position: absolute;
      border: 1px solid rgba(143, 107, 255, 0.2);
      border-radius: 50%;
      transform: rotate(-16deg);
    }

    .orbit.one {
      width: 640px;
      height: 212px;
      right: -108px;
      top: 70px;
    }

    .orbit.two {
      width: 760px;
      height: 252px;
      right: -198px;
      top: 132px;
      opacity: 0.7;
    }

    .grid {
      position: absolute;
      inset: 0;
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(circle at 68% 42%, black, transparent 68%);
    }

    .content {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 338px;
      gap: 36px;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 58px 74px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #c4b5fd;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .spark {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      background: #8F6BFF;
      box-shadow: 0 0 24px rgba(143, 107, 255, 0.9);
    }

    h1 {
      margin: 20px 0 12px;
      font-size: 74px;
      line-height: 0.95;
      letter-spacing: 0;
      font-weight: 700;
    }

    p {
      max-width: 556px;
      margin: 0;
      color: rgba(255, 255, 255, 0.76);
      font-size: 29px;
      line-height: 1.22;
      font-weight: 600;
      letter-spacing: 0;
    }

    .proof-row {
      display: flex;
      gap: 14px;
      margin-top: 32px;
    }

    .proof {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      height: 42px;
      padding: 0 17px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.07);
      color: rgba(255, 255, 255, 0.82);
      font-size: 17px;
      font-weight: 700;
      backdrop-filter: blur(16px);
    }

    .check {
      width: 17px;
      height: 17px;
      border-radius: 999px;
      background: linear-gradient(135deg, #8F6BFF, #22d3ee);
    }

    .logo-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: 318px;
      height: 318px;
      justify-self: end;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 22%, rgba(255,255,255,0.16), transparent 28%),
        linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
      box-shadow:
        0 36px 90px rgba(52, 33, 94, 0.46),
        inset 0 0 0 1px rgba(255,255,255,0.12);
    }

    .logo-wrap::before {
      content: "";
      position: absolute;
      inset: -22px;
      border-radius: 50%;
      background: conic-gradient(from 210deg, transparent, rgba(143, 107, 255, 0.72), rgba(34, 211, 238, 0.4), transparent);
      filter: blur(18px);
      opacity: 0.58;
      z-index: -1;
    }

    .logo {
      width: 252px;
      height: 252px;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 22px 38px rgba(0, 0, 0, 0.45));
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="grid"></div>
    <div class="orbit one"></div>
    <div class="orbit two"></div>
    <section class="content">
      <div>
        <div class="kicker"><span class="spark"></span> Progress-based accountability</div>
        <h1>ChallengeSphere</h1>
        <p>Turn goals into social challenges.</p>
        <div class="proof-row" aria-hidden="true">
          <span class="proof"><span class="check"></span> Daily submissions</span>
          <span class="proof"><span class="check"></span> Leaderboards</span>
          <span class="proof"><span class="check"></span> Community</span>
        </div>
      </div>
      <div class="logo-wrap">
        <img class="logo" src="../assets/images/logo.png" alt="">
      </div>
    </section>
  </main>
</body>
</html>
